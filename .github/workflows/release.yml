name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required for softprops/action-gh-release to create the release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish framework-dependent build
        run: dotnet publish src/SparkTray -c Release -r win-x64 --self-contained false -o publish/framework-dependent

      - name: Publish self-contained build
        run: dotnet publish src/SparkTray -c Release -r win-x64 --self-contained -p:PublishReadyToRun=true -o publish/standalone

      - name: Zip framework-dependent build
        run: Compress-Archive -Path publish/framework-dependent/* -DestinationPath SparkTray-win-x64.zip
        shell: pwsh

      - name: Zip standalone build
        run: Compress-Archive -Path publish/standalone/* -DestinationPath SparkTray-win-x64-standalone.zip
        shell: pwsh

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SparkTray-win-x64.zip
            SparkTray-win-x64-standalone.zip
          generate_release_notes: true
